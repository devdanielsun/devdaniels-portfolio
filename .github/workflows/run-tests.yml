name: Run Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests Job
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Setup Node.js (ensure version >= 22.22.3)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run linting
      - name: Run linting
        run: npm run lint

      # Run unit tests (headless)
      - name: Run unit tests (headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless
