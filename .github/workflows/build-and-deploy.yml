name: Build and Deploy to Azure

on:
  push:
    branches: ["main"]

env:
  APP_LOCATION: "/" # Angular source root
  API_LOCATION: "" # No API
  APP_ARTIFACT_LOCATION: "dist/devdaniels-portfolio/browser" # Angular build output

permissions:
  id-token: write
  contents: read

jobs:
  test:
    uses: ./.github/workflows/run-tests.yml

  infrastructure:
    uses: ./.github/workflows/deploy-infra.yml
    secrets: inherit

  build_and_deploy:
    needs: [test, infrastructure]
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Setup Node.js (ensure version >= 22.22.3)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      # Stamp version
      - name: Set app version
        run: sed -i "s/0\.dev/0.${{ github.run_number }}/" src/environments/environment.ts

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build Angular project
      - name: Build Angular
        run: npx ng build --configuration production

      - name: Debug build output
        run: |
          echo "--- Listing dist/ ---"
          find dist -type f -name "index.html" 2>/dev/null || echo "No index.html found in dist/"
          echo "--- Full dist tree (first 50 lines) ---"
          find dist -type f | head -50 || echo "No dist/ directory found"

      # Deploy to Azure Static Web App
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ${{ env.APP_LOCATION }}
          output_location: ${{ env.APP_ARTIFACT_LOCATION }}
          app_build_command: "echo 'Already built'"
